#
# PA Toolbox — dependency version catalog
#
# 商用配布のため、ここに追加する依存は「商用利用可のライセンス」でなければならない。
# 許可リストは app/build.gradle.kts の licensee ブロックで機械的に強制している。
# GPL / AGPL / LGPL / 非商用限定のライブラリは追加しないこと（詳細は THIRD_PARTY.md）。
#
[versions]
# --- Build toolchain ---
# AGP 9.3.x は Gradle 9.5+ / JDK 17+ / build-tools 36.0.0 を要求する
agp = "9.3.1"
kotlin = "2.3.20"
ksp = "2.3.11"
licensee = "1.14.1"

# --- SDK levels ---
# compileSdk 37: androidx.core 1.19.0 以降が compileSdk 37 以上を要求するため。
#   コンパイル対象を上げるだけで、実行時の挙動は targetSdk が決める。
# targetSdk 36: 2026/8/31 以降 Google Play の必須ライン。Android 17 の新挙動には
#   検証してから入るので、あえて 36 に留めている。
# minSdk 26: AAudio（低遅延オーディオ）と java.time が使える下限
compileSdk = "37"
minSdk = "26"
targetSdk = "36"

# --- AndroidX / Compose ---
composeBom = "2026.06.01"
androidxCore = "1.19.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
androidxNavigation = "2.9.8"
androidxDatastore = "1.2.1"
androidxSplashscreen = "1.2.0"
androidxProfileinstaller = "1.4.1"
androidxHiltNavigation = "1.4.0"
androidxTestCore = "1.7.0"
androidxTestJunit = "1.3.0"

# --- Libraries ---
coroutines = "1.11.0"
serialization = "1.11.0"
hilt = "2.60.1"
room = "2.8.4"
billing = "9.1.0"

# --- Test ---
junit4 = "4.13.2"
truth = "1.4.5"
turbine = "1.2.1"
robolectric = "4.16.1"

[libraries]
# --- Compose（バージョンは BOM が決める） ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# --- AndroidX ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidxSplashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "androidxProfileinstaller" }
# hiltViewModel() は androidx.hilt.navigation.compose から
# androidx.hilt.lifecycle.viewmodel.compose に移動した
androidx-hilt-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHiltNavigation" }

# --- Kotlin ---
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# --- DI ---
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

# --- Persistence ---
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# --- Billing（Phase 5 で本実装。v8 以上が Play の必須要件） ---
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }

# --- Test ---
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }

# --- :build-logic が使う Gradle プラグイン本体 ---
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
room-gradlePlugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# AGP 9 は Kotlin サポートを内蔵しており、org.jetbrains.kotlin.android は適用してはいけない
# （適用するとビルドが失敗する）。Android モジュールの Kotlin 設定は AGP 側が持つ。
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
licensee = { id = "app.cash.licensee", version.ref = "licensee" }

# --- ローカル convention plugin（:build-logic:convention） ---
pa-android-application = { id = "pa.android.application" }
pa-android-library = { id = "pa.android.library" }
pa-android-compose = { id = "pa.android.compose" }
pa-android-feature = { id = "pa.android.feature" }
pa-android-hilt = { id = "pa.android.hilt" }
pa-android-room = { id = "pa.android.room" }
pa-jvm-library = { id = "pa.jvm.library" }
